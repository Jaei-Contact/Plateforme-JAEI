name: Sauvegarde quotidienne (base + carte fichiers)

# Incident du 28-29/09/2026 : la table submissions (et tout ce qui en
# dépend) a été vidée directement en base, sans que rien ne l'ait
# sauvegardée nulle part — la fenêtre de restauration Neon (gratuite,
# glissante sur 6h) était largement dépassée le temps qu'on s'en
# aperçoive. Ce workflow tourne chaque nuit et produit trois choses :
#
#  1. Un export complet de la base (pg_dump) — restauration complète en
#     cas de nouvel incident.
#  2. Un CSV léger listant, pour chaque fichier déposé, l'article auquel
#     il appartient et son adresse Cloudinary — consultable sans avoir à
#     restaurer quoi que ce soit, pour retrouver "quel fichier va avec
#     quel article" même si seule la base est perdue.
#  3. Un CSV des factures d'APC (numéro, article, payeur, montant, adresse
#     du PDF sur Cloudinary) — mêmes usages que le CSV des fichiers.
#
# Les trois sont stockés comme artefacts GitHub Actions (jamais commités
# dans l'historique Git), conservés 30 jours glissants.
#
# CHIFFREMENT OBLIGATOIRE : le dépôt du client est PUBLIC, et les artefacts
# d'un dépôt public sont téléchargeables par n'importe quel compte GitHub.
# Le dump contient les emails et les mots de passe hachés de tous les
# comptes : il n'est donc jamais déposé en clair. Les deux fichiers sont
# chiffrés (gpg, AES-256) avec la phrase secrète BACKUP_PASSPHRASE, et le
# job s'arrête AVANT tout export si cette phrase est absente ou trop courte.
#
# Pré-requis à faire une seule fois, à la main, côté GitHub — jamais par
# Claude : Settings > Secrets and variables > Actions > New repository
# secret :
#   DATABASE_URL      = la chaîne de connexion Neon (celle utilisée en
#                       production, avec ?sslmode=require)
#   BACKUP_PASSPHRASE = une phrase secrète d'au moins 20 caractères, à
#                       conserver AUSSI dans un gestionnaire de mots de
#                       passe : sans elle, les sauvegardes sont définitivement
#                       illisibles.
#
# Restauration : docs/EXPLOITATION.md §4.4 (déchiffrer, puis pg_restore).

on:
  schedule:
    - cron: '0 2 * * *'   # 02h00 UTC chaque jour (faible trafic)
  workflow_dispatch: {}    # bouton "Run workflow" pour lancer une sauvegarde à la demande

permissions:
  contents: read

jobs:
  backup:
    # Ne tourne que dans le dépôt du client (organisation Jaei-Contact). Une
    # copie du dépôt, par exemple le dépôt personnel du prestataire, n'a ni
    # les secrets ni besoin de sauvegarde : sans cette condition elle
    # échouerait (et enverrait un mail d'échec) chaque nuit.
    if: github.repository_owner == 'Jaei-Contact'
    # Version épinglée : le label ubuntu-latest migre vers Ubuntu 26 à partir du
    # 19/10/2026, et le dépôt apt.postgresql.org (installé à l'étape suivante) doit
    # exister pour la version d'Ubuntu utilisée. À changer volontairement, après essai.
    runs-on: ubuntu-24.04
    steps:
      - name: Vérifier la phrase secrète (aucun export sans chiffrement)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "${#BACKUP_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Le secret BACKUP_PASSPHRASE est absent ou trop court (20 caractères minimum). Aucune sauvegarde n'est produite : un export en clair ne doit jamais être publié (dépôt public)."
            exit 1
          fi

      - name: Installer un client PostgreSQL compatible (serveur Neon en v18)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # Les images GitHub ont déjà un pg_dump plus ancien (v16) sur le PATH
          # par défaut ; sans cette ligne, c'est encore lui qui serait trouvé
          # en premier pour les étapes suivantes (cause de l'échec du 1er run :
          # "server version mismatch", 18.6 côté Neon vs 16.15 trouvé ici).
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Export complet (pg_dump)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --no-owner --format=custom \
            --file="backup/jaei_$(date +%Y%m%d_%H%M).dump"

      - name: Carte des fichiers (quel fichier -> quel article -> quelle adresse Cloudinary)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\copy (
            SELECT sf.id AS file_id, sf.submission_id, s.manuscript_number, s.title,
                   s.status, u.email AS author_email, sf.file_type, sf.description,
                   sf.original_name, sf.file_url,
                   COALESCE(sf.revision_round, 0) AS revision_round, sf.created_at
            FROM submission_files sf
            JOIN submissions s ON s.id = sf.submission_id
            JOIN users u ON u.id = s.author_id
            ORDER BY sf.submission_id, revision_round, sf.id
          ) TO STDOUT WITH CSV HEADER" > "backup/jaei_files_map_$(date +%Y%m%d_%H%M).csv"

      - name: Carte des factures (quelle facture -> quel article -> quelle adresse Cloudinary)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\copy (
            SELECT i.id AS invoice_id, i.invoice_number, i.issued_at, i.submission_id,
                   s.manuscript_number, i.payer_name, i.payer_email, i.amount, i.currency,
                   i.card_country, i.display_currency, i.display_amount,
                   i.payment_id, p.status AS payment_status, i.pdf_url
            FROM invoices i
            LEFT JOIN submissions s ON s.id = i.submission_id
            LEFT JOIN payments p ON p.id = i.payment_id
            ORDER BY i.id
          ) TO STDOUT WITH CSV HEADER" > "backup/jaei_invoices_map_$(date +%Y%m%d_%H%M).csv"

      - name: Chiffrer (AES-256) et supprimer les fichiers en clair
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd backup
          for f in *; do
            gpg --batch --yes --pinentry-mode loopback --symmetric \
                --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
                --passphrase-fd 3 --output "$f.gpg" "$f" 3<<<"$BACKUP_PASSPHRASE"
            rm -f -- "$f"
          done
          ls -l
          # Garde-fou : seuls des fichiers chiffrés doivent rester dans le dossier publié
          if ls | grep -v '\.gpg$' | grep -q .; then
            echo "::error::Un fichier non chiffré est resté dans backup/ : publication annulée."
            exit 1
          fi

      - name: Publier comme artefact (chiffré, conservé 30 jours)
        uses: actions/upload-artifact@v4
        with:
          name: jaei-backup-${{ github.run_id }}
          path: backup/*.gpg
          retention-days: 30
          if-no-files-found: error
